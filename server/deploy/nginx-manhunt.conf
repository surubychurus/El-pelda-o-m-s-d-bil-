# /etc/nginx/sites-available/manhunt  (enlazado en sites-enabled)
# Certbot añade después el bloque HTTPS (443) y la redirección automáticamente.
server {
    listen 80;
    listen [::]:80;
    server_name man.diferentt.cloud;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSocket (salas y alerta en tiempo real)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Que no corte las conexiones WebSocket inactivas a los 60 s
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
