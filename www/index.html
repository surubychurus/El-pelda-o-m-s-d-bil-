<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6c5ce7">
<title>Notificaciones</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="banner" hidden></div>

<header class="top">
  <h1>Notificaciones</h1>
  <span id="permPill" class="pill">…</span>
</header>

<main>
  <!-- ============ CREAR ============ -->
  <section id="view-crear" class="view">
    <div class="preview">
      <div class="pv-head"><span class="pv-ic" id="pvIcon">🔔</span><span class="pv-app">Notificaciones · ahora</span><span id="pvChrono" class="pv-chrono"></span></div>
      <div class="pv-title" id="pvTitle">Título</div>
      <div class="pv-body" id="pvBody">El texto aparecerá aquí</div>
      <img id="pvImg" alt="" hidden>
      <div class="pv-actions" id="pvActions"></div>
    </div>

    <form id="form" autocomplete="off">
      <div class="card">
        <h2>Contenido</h2>
        <label>Título <input id="title" required maxlength="80" placeholder="Beber agua"></label>
        <label>Texto <textarea id="body" rows="2" placeholder="Es hora de hidratarse"></textarea></label>
        <label>Texto largo <small>(se ve al expandir)</small> <textarea id="bigText" rows="3" placeholder="Opcional"></textarea></label>
        <div class="chips" id="vars">
          <button type="button" data-v="{fecha}">{fecha}</button><button type="button" data-v="{hora}">{hora}</button>
          <button type="button" data-v="{dia}">{dia}</button><button type="button" data-v="{mes}">{mes}</button>
          <button type="button" data-v="{año}">{año}</button><button type="button" data-v="{n}">{n}</button>
          <button type="button" data-v="{random:uno|dos|tres}">{random}</button>
        </div>
        <small>Toca una variable para insertarla donde estés escribiendo.</small>
      </div>

      <div class="card">
        <h2>Cuándo</h2>
        <div class="row">
          <label>Fecha <input id="date" type="date" required></label>
          <label>Hora <input id="time" type="time" required></label>
        </div>
        <label>Repetir
          <select id="repeat">
            <option value="">No repetir</option>
            <option value="minute">Cada minuto</option>
            <option value="hour">Cada hora</option>
            <option value="day">Cada día</option>
            <option value="week">Cada semana</option>
            <option value="month">Cada mes</option>
            <option value="year">Cada año</option>
          </select>
        </label>
      </div>

      <div class="card">
        <h2>Apariencia</h2>
        <div class="icons" id="icons"></div>
        <div class="row">
          <label>Color <input id="color" type="color" value="#6c5ce7"></label>
          <label>Prioridad
            <select id="importance">
              <option value="5">Máxima</option>
              <option value="4" selected>Alta</option>
              <option value="3">Normal</option>
              <option value="2">Baja (silenciosa)</option>
            </select>
          </label>
        </div>
        <label class="switch"><input id="ongoing" type="checkbox"><span>Fija: no se puede quitar deslizando</span></label>
      </div>

      <div class="card">
        <h2>Imagen y tiempo</h2>
        <label class="file">
          <input id="imageFile" type="file" accept="image/*">
          <span>📷 Elegir imagen</span>
        </label>
        <div id="imgBox" hidden>
          <img id="imgPrev" alt="">
          <div>
            <select id="imageMode">
              <option value="big">Grande (al expandir)</option>
              <option value="icon">Icono lateral</option>
            </select>
            <button type="button" id="imgClear" class="link">Quitar imagen</button>
          </div>
        </div>
        <div class="row">
          <label>Cronómetro / temporizador
            <select id="chrono">
              <option value="none">Ninguno</option>
              <option value="up">Cronómetro (sube)</option>
              <option value="down">Temporizador (cuenta atrás)</option>
            </select>
          </label>
          <label id="chronoWrap">Minutos <input id="chronoMin" type="number" min="1" max="1440" value="5"></label>
        </div>
      </div>

      <div class="card">
        <h2>Botones <small>(máx. 3)</small></h2>
        <div id="buttons"></div>
        <div class="chips">
          <button type="button" id="addBtn">＋ Añadir botón</button>
          <button type="button" id="whatsapp">💬 Estilo WhatsApp</button>
        </div>
        <small>Leído, Posponer, Responder y Temporizador actúan sin abrir la app.</small>
      </div>
      <div class="spacer"></div>
    </form>
  </section>

  <!-- ============ PROGRAMADAS ============ -->
  <section id="view-lista" class="view" hidden>
    <ul id="list" class="cards"></ul>
  </section>

  <!-- ============ ACTIVIDAD ============ -->
  <section id="view-log" class="view" hidden>
    <div class="between"><h2>Acciones realizadas</h2><button type="button" id="clearLog" class="link">Limpiar</button></div>
    <ul id="log" class="cards"></ul>
  </section>
</main>

<div class="actionbar" id="actionbar">
  <button type="button" id="testNow" class="btn ghost">Probar ya</button>
  <button type="submit" form="form" class="btn primary">Programar</button>
</div>

<nav class="tabs">
  <button data-tab="crear" class="on"><span>✏️</span>Crear</button>
  <button data-tab="lista"><span>🗓</span>Programadas <b id="count" hidden>0</b></button>
  <button data-tab="log"><span>✅</span>Actividad</button>
</nav>
<script src="app.js"></script>
</body>
</html>
